name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend-react
          vercel-args: '--prod'

  health-check:
    name: Backend Health Check
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - name: Check Render Backend Health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RENDER_HEALTH_URL }}/health)
          if [ "$response" != "200" ]; then
            echo "❌ Backend health check failed: HTTP $response"
            exit 1
          fi
          echo "✅ Backend health check passed"

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-frontend, health-check]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "🚀 VOLT Deployment Complete"
          echo "Frontend: Vercel Production"
          echo "Status: ${{ needs.deploy-frontend.result }}"

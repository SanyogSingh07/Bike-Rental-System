name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  quality-gate:
    name: Run Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend-react

      - name: Frontend Type Check & Build
        run: npm run build
        working-directory: frontend-react
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Setup Java (21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend
        run: |
          chmod +x mvnw
          ./mvnw clean verify
        working-directory: backend

  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend-react

      - name: Build Production
        run: npm run build
        working-directory: frontend-react
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Vercel
        run: npx --yes vercel@latest deploy --prod --yes
        working-directory: frontend-react
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --ci
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-docs:
    name: Deploy Docs → GitHub Pages
    runs-on: ubuntu-latest
    needs: quality-gate
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Deploy Docs to gh-pages
        run: mkdocs gh-deploy --force

  health-checks:
    name: Service Health Validation
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    steps:
      - name: Verify Frontend Status (Vercel)
        run: |
          FRONTEND_URL="https://bike-rental-system-sanyog2.vercel.app"
          echo "Verifying Frontend at: $FRONTEND_URL"
          
          # Poll frontend (Max 3 minutes / 18 attempts every 10s)
          for i in {1..18}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL" || true)
            if [ "$status" = "200" ]; then
              echo "✅ Frontend is online: HTTP 200"
              exit 0
            fi
            echo "Waiting for frontend (attempt $i)... HTTP $status"
            sleep 10
          done
          echo "❌ Frontend health check timed out"
          exit 1

      - name: Verify Backend & Database Status (Railway + Supabase)
        run: |
          HEALTH_URL="${{ secrets.RAILWAY_HEALTH_URL }}/actuator/health"
          echo "Verifying Backend at: $HEALTH_URL"
          
          # Poll backend (Max 5 minutes / 30 attempts every 10s)
          for i in {1..30}; do
            response=$(curl -s "$HEALTH_URL" || true)
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            
            if [ "$status_code" = "200" ] && echo "$response" | grep -q '"status":"UP"'; then
              echo "✅ Backend and Supabase Database are online: HTTP 200 & Status UP"
              exit 0
            fi
            echo "Waiting for backend (attempt $i)... HTTP $status_code, Body: $response"
            sleep 10
          done
          echo "❌ Backend/Database health check timed out or failed"
          exit 1

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend, deploy-docs, health-checks]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "🚀 Volt Rental Deployment Status:"
          echo "Frontend (Vercel): ${{ needs.deploy-frontend.result }}"
          echo "Backend (Railway): ${{ needs.deploy-backend.result }}"
          echo "Docs (GitHub Pages): ${{ needs.deploy-docs.result }}"
          echo "Health Checks: ${{ needs.health-checks.result }}"

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        let currentFilter = params.get('filter') || 'all';
        let currentSearch = params.get('search') || '';

        const searchInput = document.getElementById("search-input");
        if (searchInput) {
            searchInput.value = currentSearch;
            searchInput.addEventListener("input", (e) => {
                currentSearch = e.target.value;
                loadBikes(currentFilter, currentSearch);
            });
        }

        const filterButtons = document.querySelectorAll(".filter-btn");
        filterButtons.forEach(btn => {
            const type = btn.getAttribute("data-type");
            if (type.toLowerCase() === currentFilter.toLowerCase()) {
                btn.className = "whitespace-nowrap px-md py-1 rounded-full border border-[#00D26A] text-[#00D26A] font-label-bold text-label-bold bg-[#00D26A]/10 filter-btn";
            } else {
                btn.className = "whitespace-nowrap px-md py-1 rounded-full border border-outline-variant text-on-surface-variant font-label-bold text-label-bold hover:bg-surface-container-high transition-colors filter-btn";
            }

            btn.addEventListener("click", () => {
                filterButtons.forEach(b => {
                    b.className = "whitespace-nowrap px-md py-1 rounded-full border border-outline-variant text-on-surface-variant font-label-bold text-label-bold hover:bg-surface-container-high transition-colors filter-btn";
                });
                btn.className = "whitespace-nowrap px-md py-1 rounded-full border border-[#00D26A] text-[#00D26A] font-label-bold text-label-bold bg-[#00D26A]/10 filter-btn";
                currentFilter = type;
                loadBikes(currentFilter, currentSearch);
            });
        });

        // Initial load
        loadBikes(currentFilter, currentSearch);
    });
</script>

<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login - VOLT</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#2b2a2a",
                        "surface": "#141313",
                        "tertiary": "#cac6c3",
                        "on-tertiary": "#32302f",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-container": "#7f7c7a",
                        "outline-variant": "#444748",
                        "surface-tint": "#c8c6c5",
                        "primary-fixed": "#e5e2e1",
                        "primary-container": "#111111",
                        "error": "#ffb4ab",
                        "error-container": "#93000a",
                        "on-background": "#e5e2e1",
                        "secondary-container": "#454747",
                        "surface-variant": "#353434",
                        "on-error": "#690005",
                        "on-secondary-container": "#b4b5b5",
                        "surface-dim": "#141313",
                        "on-tertiary-fixed": "#1d1b1a",
                        "primary-fixed-dim": "#c8c6c5",
                        "on-primary-container": "#7e7c7c",
                        "background": "#141313",
                        "on-primary-fixed-variant": "#474646",
                        "on-secondary-fixed-variant": "#454747",
                        "on-surface-variant": "#c4c7c7",
                        "surface-container-lowest": "#0e0e0e",
                        "on-primary": "#313030",
                        "on-secondary-fixed": "#1a1c1c",
                        "surface-bright": "#3a3939",
                        "inverse-on-surface": "#313030",
                        "primary": "#c8c6c5",
                        "surface-container-highest": "#353434",
                        "surface-container": "#201f1f",
                        "on-secondary": "#2f3131",
                        "inverse-primary": "#5f5e5e",
                        "secondary-fixed": "#e2e2e2",
                        "tertiary-fixed": "#e6e1df",
                        "outline": "#8e9192",
                        "surface-container-low": "#1c1b1b",
                        "tertiary-container": "#121110",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-primary-fixed": "#1c1b1b",
                        "on-tertiary-fixed-variant": "#484645",
                        "secondary": "#c6c6c7",
                        "volt-green": "#00D26A",
                        "card-layer": "#2D2D2D"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "lg": "24px",
                        "container-margin": "20px",
                        "unit": "4px",
                        "xs": "4px",
                        "gutter": "16px",
                        "md": "16px",
                        "xl": "40px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "title-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-bold": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "label-bold": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #111111;
        }
        .glass-card {
            background: rgba(45, 45, 45, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .floating-input {
            background-color: transparent;
            border: none;
            border-bottom: 2px solid #444748;
            border-radius: 0;
            padding: 24px 0 8px 0;
            color: #e5e2e1;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            width: 100%;
            transition: border-color 0.3s ease;
        }
        .floating-input:focus {
            outline: none;
            border-color: #00D26A;
            box-shadow: none;
        }
        .floating-label {
            position: absolute;
            left: 0;
            top: 16px;
            color: #8e9192;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            pointer-events: none;
            transition: 0.3s ease all;
        }
        .floating-input:focus ~ .floating-label,
        .floating-input:not(:placeholder-shown) ~ .floating-label {
            top: 0;
            font-size: 12px;
            color: #00D26A;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .primary-btn {
            background-color: #00D26A;
            color: #111111;
            box-shadow: 0 20px 40px rgba(0,210,106,0.2);
            transition: all 0.3s ease;
        }
        .primary-btn:active {
            transform: scale(0.98);
            box-shadow: 0 10px 20px rgba(0,210,106,0.3);
        }
        
        .social-btn {
            background-color: transparent;
            border: 2px solid #2D2D2D;
            color: #e5e2e1;
            transition: all 0.3s ease;
        }
        .social-btn:active {
            transform: scale(0.95);
            background-color: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body class="bg-primary-container text-on-surface min-h-screen flex flex-col relative overflow-hidden font-body-lg">
    <!-- Ambient Background Glow -->
    <div class="absolute top-[-20%] left-[-10%] w-[150%] h-[150%] bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#00D26A]/5 via-transparent to-transparent -z-10 pointer-events-none"></div>
    
    <!-- Header / Brand Anchor -->
    <header class="w-full flex items-center justify-center pt-12 pb-8 z-50">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-volt-green text-[32px]" style="font-variation-settings: 'FILL' 1;">electric_bolt</span>
            <h1 class="font-display-lg text-display-lg text-primary tracking-tighter">VOLT</h1>
        </div>
    </header>

    <!-- Main Canvas -->
    <main class="flex-1 flex flex-col justify-center px-container-margin w-full max-w-md mx-auto z-10">
        
        <!-- LOGIN SECTION -->
        <div id="login-section">
            <div class="mb-10 text-center">
                <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Welcome Back</h2>
                <p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to start riding</p>
            </div>
            
            <form class="flex flex-col gap-8 w-full" id="login-form" onsubmit="event.preventDefault();">
                <!-- Username Input -->
                <div class="relative w-full">
                    <input class="floating-input" id="login-username" placeholder=" " required type="text" autocomplete="username"/>
                    <label class="floating-label font-body-lg" for="login-username">Username</label>
                    <span class="material-symbols-outlined absolute right-0 top-6 text-on-surface-variant pointer-events-none">person</span>
                </div>
                <!-- Password Input -->
                <div class="relative w-full">
                    <input class="floating-input" id="login-password" placeholder=" " required type="password" autocomplete="current-password"/>
                    <label class="floating-label font-body-lg" for="login-password">Password</label>
                    <button aria-label="Toggle password visibility" class="absolute right-0 top-6 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
                        <span class="material-symbols-outlined">visibility_off</span>
                    </button>
                </div>
                
                <!-- Sign In Button -->
                <button class="primary-btn w-full py-4 rounded-xl font-title-md text-title-md flex justify-center items-center gap-2 mt-4" type="submit">
                    Sign In
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </form>

            <!-- Sign Up Prompt -->
            <div class="mt-10 text-center w-full">
                <p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-volt-green font-title-md text-[14px] ml-1 hover:underline underline-offset-4 decoration-2 cursor-pointer" id="show-register">Create Account</a>
                </p>
            </div>
        </div>

        <!-- REGISTER SECTION -->
        <div id="register-section" style="display: none;">
            <div class="mb-10 text-center">
                <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Create Account</h2>
                <p class="font-body-sm text-body-sm text-on-surface-variant">Join VOLT today</p>
            </div>
            
            <form class="flex flex-col gap-8 w-full" id="register-form" onsubmit="event.preventDefault();">
                <!-- Username Input -->
                <div class="relative w-full">
                    <input class="floating-input" id="register-username" placeholder=" " required type="text"/>
                    <label class="floating-label font-body-lg" for="register-username">Username</label>
                    <span class="material-symbols-outlined absolute right-0 top-6 text-on-surface-variant pointer-events-none">person</span>
                </div>
                <!-- Email Input -->
                <div class="relative w-full">
                    <input class="floating-input" id="register-email" placeholder=" " required type="email"/>
                    <label class="floating-label font-body-lg" for="register-email">Email Address</label>
                    <span class="material-symbols-outlined absolute right-0 top-6 text-on-surface-variant pointer-events-none">mail</span>
                </div>
                <!-- Password Input -->
                <div class="relative w-full">
                    <input class="floating-input" id="register-password" placeholder=" " required type="password"/>
                    <label class="floating-label font-body-lg" for="register-password">Password</label>
                    <button aria-label="Toggle password visibility" class="absolute right-0 top-6 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
                        <span class="material-symbols-outlined">visibility_off</span>
                    </button>
                </div>
                
                <!-- Sign Up Button -->
                <button class="primary-btn w-full py-4 rounded-xl font-title-md text-title-md flex justify-center items-center gap-2 mt-4" type="submit">
                    Create Account
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </form>

            <!-- Sign In Prompt -->
            <div class="mt-10 text-center w-full">
                <p class="font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? 
                    <a class="text-volt-green font-title-md text-[14px] ml-1 hover:underline underline-offset-4 decoration-2 cursor-pointer" id="show-login">Login Here</a>
                </p>
            </div>
        </div>

    </main>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Simple password toggle logic
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtns = document.querySelectorAll('button[aria-label="Toggle password visibility"]');
            toggleBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const container = btn.parentElement;
                    const passwordInput = container.querySelector('input');
                    const icon = btn.querySelector('.material-symbols-outlined');
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        icon.textContent = 'visibility';
                    } else {
                        passwordInput.type = 'password';
                        icon.textContent = 'visibility_off';
                    }
                });
            });
        });
    </script>
</body>
</html>

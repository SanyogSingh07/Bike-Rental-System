<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Stations - Smart Bike Rental System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <i class="fas fa-bicycle"></i> <span>SmartBike</span>
        </a>
        <div class="header-actions">
            <button id="theme-toggle" class="theme-btn"><i class="fas fa-sun"></i></button>
        </div>
    </header>

    <div class="container">
        <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 16px;">Nearby Stations</h2>
        
        <!-- Mock Map Visual -->
        <div class="map-placeholder">
            <div style="position: absolute; width: 100%; height: 100%; opacity: 0.15; background: radial-gradient(circle, var(--primary-color) 10%, transparent 11%), radial-gradient(circle, var(--accent-color) 10%, transparent 11%); background-size: 20px 20px;"></div>
            <i class="fas fa-map-marked-alt" style="font-size: 48px; color: var(--primary-color); z-index: 1;"></i>
            <span style="font-weight: 600; font-size:14px; z-index: 1;">Interactive Network Map</span>
            <span style="font-size: 11px; color: var(--text-secondary); z-index: 1;">Showing 5 active stations in Downtown Manhattan</span>
            
            <!-- Floating simulated pins -->
            <div style="position: absolute; top: 30%; left: 40%; color: var(--primary-color); animation: bounce 2s infinite;"><i class="fas fa-map-pin" style="font-size: 24px;"></i></div>
            <div style="position: absolute; top: 60%; left: 70%; color: var(--accent-color); animation: bounce 2.5s infinite;"><i class="fas fa-map-pin" style="font-size: 24px;"></i></div>
            <div style="position: absolute; top: 70%; left: 20%; color: var(--success-color); animation: bounce 1.8s infinite;"><i class="fas fa-map-pin" style="font-size: 24px;"></i></div>
        </div>

        <style>
            @keyframes bounce {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
            }
        </style>

        <!-- Stations List -->
        <div id="stations-list">
            <div class="text-center" style="padding: 40px 0; color: var(--text-secondary);">Loading stations...</div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="stations.html" class="nav-item active">
            <i class="fas fa-map-marker-alt"></i>
            <span>Stations</span>
        </a>
        <a href="rent.html" class="nav-item nav-scan-btn">
            <i class="fas fa-qrcode"></i>
        </a>
        <a href="history.html" class="nav-item">
            <i class="fas fa-history"></i>
            <span>History</span>
        </a>
        <a href="rewards.html" class="nav-item">
            <i class="fas fa-award"></i>
            <span>Rewards</span>
        </a>
        <a href="admin.html" id="admin-nav-link" class="nav-item" style="display: none;">
            <i class="fas fa-chart-line"></i>
            <span>Admin</span>
        </a>
    </nav>

    <script src="js/app.js"></script>
    <script src="js/rental.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadStations();
        });
    </script>
</body>
</html>

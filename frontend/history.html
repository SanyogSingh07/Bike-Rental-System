<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride History - Smart Bike Rental System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <i class="fas fa-bicycle"></i> <span>SmartBike</span>
        </a>
        <div class="header-actions">
            <button id="theme-toggle" class="theme-btn"><i class="fas fa-sun"></i></button>
        </div>
    </header>

    <div class="container">
        <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 16px;">Ride History</h2>
        
        <div id="history-container">
            <!-- Dynamically populated -->
            <div class="text-center" style="padding: 40px 0; color: var(--text-secondary);">Loading your ride history...</div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="stations.html" class="nav-item">
            <i class="fas fa-map-marker-alt"></i>
            <span>Stations</span>
        </a>
        <a href="rent.html" class="nav-item nav-scan-btn">
            <i class="fas fa-qrcode"></i>
        </a>
        <a href="history.html" class="nav-item active">
            <i class="fas fa-history"></i>
            <span>History</span>
        </a>
        <a href="rewards.html" class="nav-item">
            <i class="fas fa-award"></i>
            <span>Rewards</span>
        </a>
        <a href="admin.html" id="admin-nav-link" class="nav-item" style="display: none;">
            <i class="fas fa-chart-line"></i>
            <span>Admin</span>
        </a>
    </nav>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadRideHistory();
        });

        async function loadRideHistory() {
            const container = document.getElementById("history-container");
            if (!container) return;

            try {
                const history = await apiRequest("/history");
                
                // Only show completed rides
                const completed = history.filter(r => r.status === "COMPLETED");

                if (completed.length === 0) {
                    container.innerHTML = `
                        <div class="card text-center" style="padding: 40px 20px;">
                            <i class="fas fa-history" style="font-size: 40px; color: var(--text-secondary); margin-bottom: 12px;"></i>
                            <h3 style="font-size: 16px; margin-bottom: 6px;">No Rides Found</h3>
                            <p style="color: var(--text-secondary); font-size:13px;">Your completed rides will appear here.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = "";
                completed.forEach(r => {
                    const date = new Date(r.startTime).toLocaleDateString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    const durationMin = Math.round(r.distanceTravelled / 0.25);

                    const item = document.createElement("div");
                    item.className = "card";
                    item.style.padding = "16px";
                    item.innerHTML = `
                        <div class="d-flex justify-between align-center mb-4">
                            <div>
                                <h3 style="font-size: 16px; font-weight: 700;">${r.bike.name}</h3>
                                <span style="font-size: 12px; color: var(--text-secondary);">${date}</span>
                            </div>
                            <strong style="color: var(--primary-color); font-size: 16px;">₹${r.totalCost.toFixed(2)}</strong>
                        </div>
                        <div class="bike-meta" style="margin: 0; padding-top: 10px; border-top: 1px solid var(--border-color); font-size:12px;">
                            <span><i class="fas fa-clock"></i> ${durationMin} mins</span>
                            <span><i class="fas fa-route"></i> ${r.distanceTravelled.toFixed(2)} km</span>
                            <span style="color: var(--success-color); font-weight:600;"><i class="fas fa-leaf"></i> ${(r.distanceTravelled * 0.21).toFixed(2)} kg CO₂</span>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                container.innerHTML = `<div class="text-center" style="padding: 40px 0; color: var(--danger-color);">Error loading history.</div>`;
            }
        }
    </script>
</body>
</html>
